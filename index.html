<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Money Tracker"><meta name="theme-color" content="#6a5cff">
<title>Money Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f5f4fb;--cd:#fff;--tx:#1d1b32;--mu:#8a89a3;--ac:#6a5cff;--gn:#12b886;--rd:#ff5d73;--bd:#eceaf6;--ip:#f1f0fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--cd:#201d33;--tx:#efedff;--mu:#9a98b4;--ac:#8f84ff;--gn:#3ddc9f;--rd:#ff7b8d;--bd:#2d2946;--ip:#2a2640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--cd:#201d33;--tx:#efedff;--mu:#9a98b4;--ac:#8f84ff;--gn:#3ddc9f;--rd:#ff7b8d;--bd:#2d2946;--ip:#2a2640;color-scheme:dark}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:12px 14px 112px}
h1{font-size:22px;margin:2px 2px 12px;display:flex;justify-content:space-between;align-items:baseline;background:linear-gradient(90deg,#6a5cff,#ff5d9e);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{font-size:11px;font-weight:400;-webkit-text-fill-color:var(--mu)}
h2{font-size:15px;margin:0 0 8px}
.sec{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.card{background:var(--cd);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.hero{color:#fff}.hero .mu{color:rgba(255,255,255,.8)}.big{font-size:28px;font-weight:700;margin:4px 0 10px}
.msg{background:var(--ip);color:var(--ac);font-weight:500}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:13px}.in{color:var(--gn)}.out{color:var(--rd)}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--ip);color:var(--tx);font:inherit;font-size:16px;min-height:46px;min-width:0;margin-bottom:8px}
input.amt{font-size:30px;font-weight:700;text-align:center;min-height:62px}
button{font:inherit;min-height:42px;border:0;border-radius:12px;padding:9px 14px;background:var(--ip);color:var(--tx)}
button.p{background:linear-gradient(90deg,#6a5cff,#b05cff);color:#fff;width:100%;padding:12px;font-weight:600}
button.p.sm{width:auto;min-height:46px;margin-bottom:8px}
button.d{background:none;color:var(--rd);min-height:34px;padding:4px 8px;font-size:13px}
.seg{display:flex;gap:4px;background:var(--ip);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;background:none}.seg .on{background:var(--cd);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tx{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.tx:first-of-type{border-top:0}.tx.edit{display:block}
.ic{width:38px;height:38px;border-radius:12px;background:var(--ip);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.tm{flex:1;min-width:0;display:flex;flex-direction:column}.tm .mu{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta{display:flex;flex-direction:column;align-items:flex-end}.ta button.d{padding:0 4px;min-height:26px}
.bud{border-top:1px solid var(--bd);padding:10px 0 2px;margin-top:8px}
.bar{height:8px;background:var(--ip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#12b886,#4dabf7);border-radius:6px}.over i{background:linear-gradient(90deg,#ff9f43,#ff5d73)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px;min-height:64px;overflow:hidden;white-space:nowrap}.cat span{font-size:22px}.cat.on{background:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--ip);border-radius:20px;padding:4px 4px 4px 10px;font-size:14px}.chip button.d{min-height:26px;padding:0 8px}
.sub{font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 6px}
.addrow{display:flex;gap:8px}.addrow input{margin:0 0 8px}.addrow .emo{width:64px;flex:none;text-align:center}
.fold{padding:0}.fh{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;min-height:52px;padding:0 14px;font-weight:600;color:var(--tx)}.fb{padding:0 14px 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;min-height:84px;text-align:left}.tile span{font-size:24px}.tile small{color:var(--mu);font-size:12px}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
textarea{width:100%;font:inherit;font-size:16px;border-radius:12px;border:0;background:var(--ip);color:var(--tx);padding:10px;margin-bottom:8px}
code{background:var(--ip);padding:1px 5px;border-radius:5px;word-break:break-all}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;font-size:11px;color:var(--mu);padding:4px;min-height:52px}nav button.on{color:var(--ac);font-weight:700}
</style></head><body>
<h1>Money Tracker <small id="st"></small></h1>
<div id="app"></div><nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const cents=v=>Math.round(parseFloat(String(v).replace(/[^0-9.]/g,''))*100)||0;
const money=(c,cur)=>{try{return new Intl.NumberFormat('en-US',{style:'currency',currency:cur}).format(c/100)}catch(e){return cur+' '+(c/100).toFixed(2)}};
const CUR=['MYR','SGD','USD','EUR','GBP','JPY','THB','IDR','CNY','HKD','AUD','KRW'];
const PAL=['#ff6b6b','#ffa94d','#fcc419','#69db7c','#38d9a9','#4dabf7','#748ffc','#da77f2','#f783ac','#a9e34b'];
const GR=['linear-gradient(135deg,#6a5cff,#b05cff)','linear-gradient(135deg,#00b8a9,#3b82f6)','linear-gradient(135deg,#ff7a59,#ff3d81)','linear-gradient(135deg,#f59f00,#ff6a3d)'];
const colr=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const ZH={'餐饮':'Food','交通':'Transport','购物':'Shopping','房租':'Rent','娱乐':'Entertainment','账单':'Bills','旅行':'Travel','未分类':'Uncategorized','工资':'Salary','奖金':'Bonus','其他收入':'Other income'};
const DEF={Food:'🍜',Transport:'🚌',Shopping:'🛍️',Rent:'🏠',Entertainment:'🎬',Bills:'🧾',Travel:'✈️',Uncategorized:'🏷️',Salary:'💼',Bonus:'🎁',Investment:'📈','Other income':'💰'};
Object.assign(DEF,{Family:'👪',Groceries:'🛒','Grab car':'🚕',Petrol:'⛽','Air Ticket':'🛫',Hotel:'🏨','Tax Giro':'🏛️',Insurance:'🛡️'});
const DEFL={};Object.keys(DEF).forEach(k=>DEFL[k.toLowerCase()]=DEF[k]);
const AI={normal:'🏦',travel:'✈️',invest:'📈'},RI={dep:'💵',pro:'📈',los:'📉',out:'🏧'};
const AICONS=['🏦','💵','💳','👛','🪙','🏠','✈️','📈','💼','🎒'];
const SG={i:1,dep:1,pro:1,e:-1,los:-1,out:-1};
const RT={dep:'Deposit',pro:'Profit',los:'Loss',out:'Cash out'};
const defCfg=()=>({v:3,icons:{},accounts:[],cats:['Food','Transport','Shopping','Rent','Entertainment','Bills','Travel','Uncategorized'],icats:['Salary','Bonus','Investment','Other income'],budgets:[],goals:[],rates:{},mlist:[],lastAuto:''});
let S={cfg:null,months:{},month:today().slice(0,7),tab:'home',addT:'e',addCur:'',accId:'',pend:'',msg:''};
let DB=null,UID=null,ready=false;

const TO=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const fetchT=(u,o)=>TO(fetch(u,o),5000);
let SB=null,OFF=false;
try{SB=JSON.parse(localStorage.getItem('mt:sb')||'null')}catch(e){}
const sbSave=()=>{try{localStorage.setItem('mt:sb',JSON.stringify(SB))}catch(e){}};
async function sbAuth(body,grant){
  const r=await fetchT(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('auth');
  const d=await r.json();SB.at=d.access_token;SB.rt=d.refresh_token;SB.exp=Date.now()+(d.expires_in-60)*1000;SB.uid=d.user.id;sbSave();
}
async function sbTok(){
  if(!SB||!SB.rt)return null;
  if(!SB.at||Date.now()>SB.exp){try{await sbAuth({refresh_token:SB.rt},'refresh_token')}catch(e){return null}}
  return SB.at;
}
async function sbReq(path,opt){
  const t=await sbTok();if(!t)throw new Error('no auth');
  const r=await fetchT(SB.url+'/rest/v1/'+path,{...opt,headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...((opt&&opt.headers)||{})}});
  if(!r.ok)throw new Error('http '+r.status);return r;
}
const mirror={get:k=>{try{const v=localStorage.getItem('mt:'+k);return v?JSON.parse(v):null}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('mt:'+k,JSON.stringify(v))}catch(e){}}};
const dirty=()=>{try{return JSON.parse(localStorage.getItem('mt:dirty')||'[]')}catch(e){return[]}};
const setDirty=a=>{try{localStorage.setItem('mt:dirty',JSON.stringify(a))}catch(e){}};
async function put(k,v){await sbReq('kv?on_conflict=user_id,k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SB.uid,k,v})})}
async function initDb(){}
async function ld(k){
  if(SB&&SB.rt&&!OFF){
    const d=dirty();
    if(d.includes(k)){const v=mirror.get(k);try{await put(k,v);setDirty(d.filter(x=>x!==k))}catch(e){OFF=true}return v}
    try{const r=await sbReq('kv?k=eq.'+encodeURIComponent(k)+'&select=v'),a=await r.json();if(a.length){mirror.set(k,a[0].v);return a[0].v}}catch(e){OFF=true}
  }
  return mirror.get(k);
}
async function sv(k,v){
  mirror.set(k,v);
  if(SB&&SB.rt){let ok=false;if(!OFF){try{await put(k,v);ok=true}catch(e){OFF=true}}if(!ok){const d=dirty();if(!d.includes(k)){d.push(k);setDirty(d)}}}
}
async function loadAll(){const raw=await ld('cfg');S.cfg=raw?mig(Object.assign(defCfg(),raw,{v:raw.v})):defCfg();S.months={};await ensure(S.month)}
function cloudCard(){
  if(SB&&SB.rt)return`<div class="card"><h2>\u2601\ufe0f Cloud sync</h2><div class="mu" style="margin-bottom:8px">Connected as ${E(SB.email||'')}. Your data is saved to your own cloud database.</div><div class="g2"><button data-a="sbSync">Sync now</button><button class="d" data-a="sbOut" style="min-height:42px">Sign out</button></div></div>`;
  return`<div class="card"><h2>\u2601\ufe0f Cloud sync (optional)</h2><div class="mu" style="margin-bottom:8px">Connect your own Supabase project so every device and the Apple Pay auto-log share one set of data.</div><input id="su" placeholder="Project URL (https://xxxx.supabase.co)" autocapitalize="off" autocorrect="off"><input id="sk" placeholder="Anon public key" autocapitalize="off" autocorrect="off"><input id="se" type="email" placeholder="Email" autocapitalize="off"><input id="sp" type="password" placeholder="Password"><button class="p" data-a="sbIn">Connect</button></div>`;
}
function mig(c){
  const D=defCfg();['accounts','cats','icats','budgets','goals','mlist'].forEach(k=>{if(!Array.isArray(c[k]))c[k]=D[k]});['icons','rates'].forEach(k=>{if(!c[k]||typeof c[k]!=='object')c[k]={}});if(typeof c.lastAuto!=='string')c.lastAuto='';
  if(c.v===3)return c;c.v=3;const m=x=>ZH[x]||x;c.icons=c.icons||{};
  c.cats=(c.cats||[]).map(m);c.icats=(c.icats||[]).map(m);
  if(!c.icats.includes('Investment'))c.icats.push('Investment');
  (c.accounts||[]).forEach(a=>{a.kind=a.kind||(a.travel?'travel':'normal')});
  c.rates=c.rates||{};c.mlist=c.mlist||[];c.budgets=(c.budgets||[]).filter(b=>{b.cat=m(b.cat);if(b.acc)return true;const a=c.accounts.find(x=>x.kind==='normal'&&x.cur===b.cur);if(!a)return false;b.acc=a.id;b.month=b.month||today().slice(0,7);return true});return c;
}
const saveCfg=()=>sv('cfg',S.cfg);
function budMsg(acc,cat,m){const b=S.cfg.budgets.find(x=>x.month===m&&x.acc===acc&&x.cat===cat);if(!b)return'';const a=A(acc),s=(S.months[m]||[]).filter(x=>x.t==='e'&&x.acc===acc&&x.cat===cat).reduce((z,x)=>z+x.a,0);return' · '+cat+' budget: '+(s>b.limit?'over by '+money(s-b.limit,a.cur):money(b.limit-s,a.cur)+' left')}
async function ensure(m){if(!S.months[m]){const d=await ld('m_'+m);S.months[m]=(Array.isArray(d&&d.tx)?d.tx:[]).map(x=>(x.cat=ZH[x.cat]||x.cat,x))}return S.months[m]}
const A=id=>S.cfg.accounts.find(a=>a.id===id);
const normals=()=>S.cfg.accounts.filter(a=>a.kind==='normal');
const curs=l=>[...new Set(l.map(a=>a.cur))];
async function addTx(t){
  const m=t.d.slice(0,7),arr=await ensure(m);arr.push(t);
  if(!S.cfg.mlist.includes(m))S.cfg.mlist.push(m);
  const a=A(t.acc);if(a)a.bal+=SG[t.t]*t.a;
  await sv('m_'+m,{tx:arr});await saveCfg();
}
async function delTx(m,id){
  const arr=await ensure(m),i=arr.findIndex(x=>x.id===id);if(i<0)return;
  const t=arr.splice(i,1)[0],a=A(t.acc);if(a)a.bal-=SG[t.t]*t.a;
  await sv('m_'+m,{tx:arr});await saveCfg();
}
async function updTx(m,id,p){const o=(await ensure(m)).find(x=>x.id===id);if(!o)return;const t={...o,...p};await delTx(m,id);await addTx(t)}
async function allTx(accId){
  const ms=S.cfg.mlist.slice();if(!ms.includes(S.month))ms.push(S.month);
  await Promise.all(ms.map(ensure));
  return ms.flatMap(m=>S.months[m]).filter(x=>x.acc===accId).sort((a,b)=>b.d.localeCompare(a.d));
}
async function auto(){
  const h=(location.hash||'').slice(1);
  const m=/^add_([A-Za-z]{3})_([0-9.]+)(?:_([^_]*))?(?:_([0-9]+))?$/.exec(h);
  if(!m)return;
  if(m[4]&&S.cfg.lastAuto===h){S.msg='This payment was already logged';return}
  const cur=m[1].toUpperCase(),amt=cents(m[2]),ac=normals().find(x=>x.cur===cur);
  if(!ac||!amt){S.msg='Auto-log failed: no normal '+cur+' account found, or invalid amount';return}
  const note=(m[3]||'').replace(/-/g,' ').trim();
  if(!S.cfg.cats.includes('Uncategorized'))S.cfg.cats.push('Uncategorized');
  S.month=today().slice(0,7);await ensure(S.month);
  await addTx({id:uid(),t:'e',a:amt,acc:ac.id,cat:'Uncategorized',note,d:today(),auto:1});
  if(m[4])S.cfg.lastAuto=h;await saveCfg();
  S.msg='Auto-logged '+money(amt,cur)+(note?' · '+note:'')+' ('+ac.name+')'+budMsg(ac.id,'Uncategorized',S.month);
}

const monNav=()=>`<div class="row" style="margin-bottom:10px"><button data-a="mon" data-v="-1">‹</button><b>${S.month}</b><button data-a="mon" data-v="1">›</button></div>`;
const opts=(arr,sel)=>arr.map(x=>`<option${x===sel?' selected':''}>${E(x)}</option>`).join('');
const ico=c=>(S.cfg.icons&&S.cfg.icons[c])||DEFL[String(c).toLowerCase()]||'🏷️';
const FLAG={MYR:'🇲🇾',SGD:'🇸🇬',USD:'🇺🇸',EUR:'🇪🇺',GBP:'🇬🇧',JPY:'🇯🇵',THB:'🇹🇭',IDR:'🇮🇩',CNY:'🇨🇳',HKD:'🇭🇰',AUD:'🇦🇺',KRW:'🇰🇷'};
const aico=a=>a.icon||(a.kind==='normal'&&FLAG[a.cur])||AI[a.kind];
const copts=(arr,sel)=>arr.map(x=>`<option value="${E(x)}"${x===sel?' selected':''}>${ico(x)} ${E(x)}</option>`).join('');
const del=(k,label)=>{const[a,v]=[k.slice(0,k.indexOf(':')),k.slice(k.indexOf(':')+1)];return`<button class="d" data-a="${a}" data-v="${E(v)}">${S.pend===k?'Tap to confirm':label||'Delete'}</button>`};
const tm=(a,cur)=>{const r=S.cfg.rates[cur];if(!r)return'';const m=Math.round(a/r*60);return'≈ '+Math.floor(m/60)+'h '+m%60+'m of work'};
const curSel=(id,list,sel)=>`<select id="${id}">${opts(list,sel)}</select>`;
const dlist=`<datalist id="cl">${CUR.map(x=>`<option>${x}`).join('')}</datalist>`;

const fold=(id,title,body)=>`<div class="card fold"><button class="fh" data-a="open" data-v="${id}"><span>${title}</span><span>${S.open===id?'▾':'▸'}</span></button>${S.open===id?`<div class="fb">${body}</div>`:''}</div>`;
const sec=t=>`<div class="sec">${t}</div>`;
const empty=(ic,t)=>`<div class="card empty"><div style="font-size:32px">${ic}</div>${t}</div>`;
function txRow(x,m,showAcc){
  const a=A(x.acc)||{name:'?',cur:'',kind:'normal'},pos=SG[x.t]>0,cat=x.t==='i'||x.t==='e',label=cat?E(x.cat):RT[x.t];
  if(S.editTx===x.id)return`<div class="tx edit"><div class="g2"><input id="ea" type="number" inputmode="decimal" step="0.01" value="${x.a/100}"><input id="ed" type="date" value="${x.d}"></div>${cat?`<select id="ec">${copts(x.t==='i'?S.cfg.icats:S.cfg.cats,x.cat)}</select>`:''}<input id="en" value="${E(x.note)}" placeholder="Note"><div class="g2"><button class="p" data-a="saveTx2" data-v="${x.d.slice(0,7)}|${x.id}">Save</button><button data-a="editTx" data-v="">Cancel</button></div></div>`;
  return`<div class="tx"><div class="ic">${cat?ico(x.cat):RI[x.t]}</div><div class="tm"><b>${label}</b><span class="mu">${x.note?E(x.note)+' · ':''}${showAcc?aico(a)+' '+E(a.name):x.d}</span></div><div class="ta"><b class="${pos?'in':'out'}">${pos?'+':'-'}${money(x.a,a.cur)}</b><span><button class="d" style="color:var(--ac)" data-a="editTx" data-v="${x.id}">Edit</button>${del('delTx:'+x.d.slice(0,7)+'|'+x.id)}</span></div></div>`;
}
async function vHome(){
  const nm=normals(),ids=nm.map(a=>a.id),tx=(S.months[S.month]||[]).filter(x=>ids.includes(x.acc)).sort((a,b)=>b.d.localeCompare(a.d));
  let h=monNav();
  if(!nm.length)return h+empty('👛','Create your first account to get started<br><button class="p" style="margin-top:12px" data-a="tab" data-v="acc">Go to Accounts</button>');
  const sum={};tx.forEach(x=>{const c=A(x.acc).cur;sum[c]=sum[c]||{i:0,e:0};sum[c][x.t]+=x.a});
  h+=curs(nm).map((c,n)=>{const s=sum[c]||{i:0,e:0};return`<div class="card hero" style="background:${GR[n%4]}"><div class="row"><b>${FLAG[c]||''} ${c}</b><span class="mu">Net this month</span></div><div class="big">${money(s.i-s.e,c)}</div><div class="g2"><div><span class="mu">Income</span><br><b>${money(s.i,c)}</b></div><div><span class="mu">Expenses</span><br><b>${money(s.e,c)}</b></div></div></div>`}).join('');
  for(const a of S.cfg.accounts.filter(x=>x.kind==='invest')){const l=await allTx(a.id),s=t=>l.filter(x=>x.t===t).reduce((z,x)=>z+x.a,0),pl=s('pro')-s('los');h+=`<div class="card hero" style="background:${GR[3]}"><div class="row"><b>${aico(a)} ${E(a.name)}</b><span class="mu">Investment</span></div><div class="big">${money(a.bal,a.cur)}</div><div class="g2"><div><span class="mu">Net P/L</span><br><b>${pl<0?'-':'+'}${money(Math.abs(pl),a.cur)}</b></div><div><span class="mu">Invested</span><br><b>${money(s('dep'),a.cur)}</b></div></div></div>`}
  const by={};tx.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
  return h+sec('Transactions')+(tx.length?Object.keys(by).sort().reverse().map(d=>`<div class="card"><div class="mu">${d}</div>${by[d].map(x=>txRow(x,S.month,1)).join('')}</div>`).join(''):empty('🧾','No transactions this month'));
}
function vAdd(){

  if(!nm.length)return empty('👛','Create an account first<br><button class="p" style="margin-top:12px" data-a="tab" data-v="acc">Go to Accounts</button>');

<input id="amt" class="amt" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${E(D.amt||'')}">
<select id="ac">${nm.map(a=>`<option value="${a.id}"${a.id===D.ac?' selected':''}>${aico(a)} ${E(a.name)} · ${a.cur}</option>`).join('')}</select>
<input type="hidden" id="ct" value="${E(sel)}">
<div class="cats">${cats.map(x=>`<button class="cat${x===sel?' on':''}" data-a="pickCat" data-v="${E(x)}"><span>${ico(x)}</span>${E(x)}</button>`).join('')}</div>
<div class="g2"><input id="nt" placeholder="Note (optional)" value="${E(D.nt||'')}"><input id="dt" type="date" value="${D.dt||today()}"></div>
<button class="p" data-a="saveTx">Save ${e?'expense':'income'}</button></div>`+fold('help','⚡ Apple Pay auto-log setup',`<p class="mu">In Shortcuts, create a Personal Automation triggered by Wallet Transaction, choose a card, and add an Open URL action:</p><p><code>YOUR-PAGE-LINK#add_MYR_AMOUNT_MERCHANT_TIMESTAMP</code></p><p class="mu">Use the transaction variables for amount and merchant. Replace spaces and symbols in the merchant with - (only letters, digits and _ ~ - . work after the #). Format the current date as yyyyMMddHHmmss for the timestamp so repeats are ignored. Hard-code the card currency, one automation per card. A normal account in that currency must exist.</p>`);

function vAcc(){
  const c=S.cfg,K={normal:'Normal',travel:'Travel',invest:'Investment'};
  const row=a=>`<div class="tx"><div class="ic">${aico(a)}</div><div class="tm"><b>${E(a.name)}</b><span class="mu">${a.cur} · ${K[a.kind]}</span></div><div class="ta"><b>${money(a.bal,a.cur)}</b><span>${a.kind!=='normal'?`<button class="d" style="color:var(--ac)" data-a="openAcc" data-v="${a.id}">Open</button>`:''}${del('delAcc:'+a.id)}</span></div></div>`;
  const chips=(k,arr)=>`<div class="chips">${arr.map(x=>`<span class="chip">${ico(x)} ${E(x)}${del('delCat:'+k+'|'+x,'×')}</span>`).join('')}</div><div class="addrow"><input id="ni${k}" class="emo" placeholder="🏷️"><input id="nc${k}" placeholder="New category"><button class="p sm" data-a="addCat" data-v="${k}">Add</button></div>`;
  const newAcc=`<input id="an" placeholder="Name, e.g. Maybank MYR"><div class="g2"><input id="acu" list="cl" placeholder="Currency (MYR)" maxlength="3"><input id="ab" type="number" inputmode="decimal" placeholder="Opening balance"></div>${dlist}<select id="ak"><option value="normal">Normal (counts in Overview)</option><option value="travel">Travel (kept out of Overview)</option><option value="invest">Investment (shown separately)</option></select><select id="ai"><option value="">Default icon</option>${AICONS.map(x=>`<option>${x}</option>`).join('')}</select><button class="p" data-a="addAcc">Add account</button>`;
  const data=(typeof cloudCard==='function'?cloudCard():'')+`<div class="tiles"><button class="tile" data-a="copyBk"><span>📋</span><b>Copy backup</b><small>All data as text</small></button><button class="tile" data-a="rs"><span>♻️</span><b>Restore</b><small>Paste a backup</small></button></div>`+(S.rs?`<textarea id="bk" rows="4" placeholder="Paste a backup here">${E(S.bk||'')}</textarea><button class="p" data-a="restoreBk">Restore from backup</button><p class="mu">This replaces the current data.</p>`:'');
  return sec('Accounts')+(c.accounts.length?`<div class="card">${c.accounts.map(row).join('')}</div>`:empty('👛','No accounts yet'))+fold('newAcc','＋ New account',newAcc)+sec('Settings')+fold('cats','🏷️ Categories',`<div class="sub">EXPENSE</div>${chips('e',c.cats)}<div class="sub">INCOME</div>${chips('i',c.icats)}<p class="mu">Tip: type an existing name and a new emoji to change its icon.</p>`)+fold('data','💾 Backup &amp; sync',data);
}
async function loadDetail(){
  const a=A(S.accId);if(!a)return'';
  const tx=await allTx(a.id),cur=a.cur,sm=t=>tx.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
  let h=`<button data-a="back">‹ Accounts</button><div class="card hero" style="background:${a.kind==='travel'?GR[2]:GR[1]};margin-top:10px"><div class="row"><b style="font-size:17px">${a.kind==='travel'?'✈ ':'📈 '}${E(a.name)}</b><span>${cur}</span></div>`;
  if(a.kind==='travel')h+=`<div style="margin-top:8px"><div class="mu">Total spent</div><b style="font-size:22px">${money(sm('e'),cur)}</b></div></div>
<div class="card"><h2>Add trip expense</h2><input id="qa" type="number" inputmode="decimal" placeholder="Amount" step="0.01"><select id="qc">${copts(S.cfg.cats,'Travel')}</select><input id="qn" placeholder="Note (optional)"><input id="qd" type="date" value="${today()}"><button class="p" data-a="quick">Save expense</button></div>`;
  else h+=`<div class="g2" style="margin-top:8px"><div><div class="mu">Invested</div><b>${money(sm('dep'),cur)}</b></div><div><div class="mu">Current value</div><b>${money(a.bal,cur)}</b></div><div><div class="mu">Profit</div><b>${money(sm('pro'),cur)}</b></div><div><div class="mu">Loss</div><b>${money(sm('los'),cur)}</b></div></div><div class="mu" style="margin-top:6px">Net P/L ${money(sm('pro')-sm('los'),cur)} · Cashed out ${money(sm('out'),cur)}</div></div>
<div class="card"><h2>Add record</h2><select id="qt">${Object.entries(RT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="qa" type="number" inputmode="decimal" placeholder="Amount" step="0.01"><input id="qn" placeholder="Note (optional)"><input id="qd" type="date" value="${today()}"><button class="p" data-a="quick">Save record</button></div>`;
  return h+`<div class="card"><h2>History</h2>${tx.length?tx.map(x=>txRow(x)).join(''):'<span class="mu">No records yet</span>'}</div>`;
}
function vBud(){
  const c=S.cfg,tx=S.months[S.month]||[],eac=c.accounts.filter(a=>a.kind!=='invest'),by={};
  c.budgets.filter(b=>b.month===S.month&&A(b.acc)).forEach(b=>(by[b.acc]=by[b.acc]||[]).push(b));
  const groups=Object.entries(by).sort((x,y)=>A(x[0]).name.localeCompare(A(y[0]).name)).map(([id,l])=>{
    const a=A(id),col=PAL[c.accounts.indexOf(a)%PAL.length];let L=0,P=0;
    const rows=l.sort((x,y)=>x.cat.localeCompare(y.cat)).map(b=>{
      const s=tx.filter(x=>x.t==='e'&&x.acc===id&&x.cat===b.cat).reduce((z,x)=>z+x.a,0),pct=b.limit?Math.min(100,Math.round(s/b.limit*100)):0,ed=S.editBud===b.id;L+=b.limit;P+=s;
      return`<div class="bud ${s>b.limit?'over':''}"><div class="row"><b>${ico(b.cat)} ${E(b.cat)}</b><span>${ed?'':`<button class="d" style="color:var(--ac)" data-a="editBud" data-v="${b.id}">Edit</button>`}${del('delBud:'+b.id)}</span></div>${ed?`<div class="row" style="margin:6px 0"><input id="eb" type="number" inputmode="decimal" step="0.01" value="${b.limit/100}" style="margin:0"><button data-a="saveBud" data-v="${b.id}">Save</button><button data-a="editBud" data-v="">Cancel</button></div>`:''}<div class="bar"><i style="width:${pct}%;${s>b.limit?'':'background:'+col}"></i></div><div class="row mu"><span>${money(s,a.cur)} / ${money(b.limit,a.cur)}</span><b class="${s>b.limit?'out':'in'}">${s>b.limit?'Over '+money(s-b.limit,a.cur):money(b.limit-s,a.cur)+' left'}</b></div></div>`}).join('');
    return`<div class="card" style="border-left:5px solid ${col}"><div class="row"><b style="color:${col}">${aico(a)} ${E(a.name)}</b><span class="mu">${a.cur} · ${money(L-P,a.cur)} left</span></div>${rows}</div>`}).join('');
  const form=eac.length?fold('newBud','＋ New budget',`<select id="ba">${eac.map(a=>`<option value="${a.id}">${aico(a)} ${E(a.name)} (${a.cur})</option>`).join('')}</select><select id="bc">${copts(c.cats)}</select><input id="bl" type="number" inputmode="decimal" placeholder="Limit for this month"><button class="p" data-a="addBud">Add budget</button>`):'';
  return monNav()+(groups||empty('📊','No budgets for '+S.month+'<br><button data-a="copyBud" style="margin-top:12px">Copy last month’s budgets</button>'))+form;
}
function vGoal(){
  const now=new Date(today()+'T00:00:00'),cl=curs(S.cfg.accounts);
  const rows=S.cfg.goals.map(g=>{
    const rem=Math.max(0,g.target-g.saved),pct=g.target?Math.min(100,Math.round(g.saved/g.target*100)):0,days=g.date?Math.ceil((new Date(g.date+'T00:00:00')-now)/864e5):null;
    const need=days>0&&rem?money(Math.ceil(rem/Math.max(1,days/30.4)),g.cur)+' / month':'';
    return`<div class="card"><div class="row"><b>🎯 ${E(g.name)}</b>${del('delGoal:'+g.id)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span>${money(g.saved,g.cur)} <span class="mu">(${pct}%)</span></span><span>${money(g.target,g.cur)}</span></div><div class="mu">${money(rem,g.cur)} to go${days!==null?' · '+(days>=0?days+' days left':'overdue '+(-days)+' days')+' ('+g.date+')':''}${need?' · save '+need:''}</div><div class="row" style="margin-top:8px"><input id="gs${g.id}" type="number" inputmode="decimal" placeholder="Amount to add" style="margin:0"><button data-a="saveGoal" data-v="${g.id}">Add</button></div></div>`}).join('');
  return(rows||empty('⭐','No savings goals yet'))+(cl.length?fold('newGoal','＋ New goal',`<input id="gn" placeholder="Goal name, e.g. Japan trip"><div class="g2">${curSel('gu',cl)}<input id="gt" type="number" inputmode="decimal" placeholder="Target amount"></div><div class="g2"><input id="gd" type="date"><input id="gi" type="number" inputmode="decimal" placeholder="Already saved"></div><button class="p" data-a="addGoal">Add goal</button>`):empty('👛','Create an account first'));
}
async function render(){
  const tabs=[['home','🏠','Overview'],['add','➕','Add'],['acc','👛','Accounts'],['bud','📊','Budget'],['goal','⭐','Goals']];
  $('#st').textContent=SB&&SB.rt?(OFF?'Cloud unreachable · saved on this device':'Cloud sync on'):'Saved on this device only';
  let body;try{body=S.tab==='acc'&&S.accId?await loadDetail():await({home:vHome,add:vAdd,acc:vAcc,bud:vBud,goal:vGoal}[S.tab])()}catch(e){body='<div class="card msg">Could not open this page: '+E(e&&e.message||e)+'</div>'}
  $('#app').innerHTML=(S.msg?`<div class="card msg">${E(S.msg)}</div>`:'')+body;
  $('#nav').innerHTML=tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><div style="font-size:18px">${t[1]}</div>${t[2]}</button>`).join('');
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const curOf=id=>val(id).toUpperCase().replace(/[^A-Z]/g,'').slice(0,3);

document.addEventListener('change',e=>{if(e.target.id==='cu'&&S.tab==='add'){S.addCur=e.target.value;render()}});
document.addEventListener('click',ev=>{run(ev)});
async function run(ev){try{await run0(ev)}catch(e){S.msg='Error: '+(e&&e.message||e);try{await render()}catch(x){}}}
async function run0(ev){
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,c=S.cfg;S.msg='';
  const armed=k=>{if(S.pend!==k){S.pend=k;render();return false}S.pend='';return true};
  if(a==='open'){S.open=S.open===v?'':v}
  else if(a==='rs'){S.rs=!S.rs}
  else if(a==='pickCat'){const i=$('#ct');if(i)i.value=v;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.v===v));return}
  else if(a==='tab'){S.tab=v;S.pend='';S.accId='';S.open='';S.draft=null}
  else if(a==='mon'){const d=new Date(S.month+'-01T00:00:00');d.setMonth(d.getMonth()+Number(v));S.month=d.getFullYear()+'-'+p2(d.getMonth()+1);await ensure(S.month)}
  else if(a==='addT'){S.draft={amt:val('amt'),nt:val('nt'),ac:val('ac'),dt:val('dt')};S.addT=v}
  else if(a==='saveTx'){
    const amt=cents(val('amt'));if(!amt||!A(val('ac'))){S.msg='Enter an amount and pick an account';return render()}
    const d=val('dt')||today();await addTx({id:uid(),t:S.addT,a:amt,acc:val('ac'),cat:val('ct'),note:val('nt'),d});
    S.month=d.slice(0,7);await ensure(S.month);S.tab='home';S.draft=null;S.msg='Saved'+(S.addT==='e'?budMsg(val('ac'),val('ct'),S.month):'')}
  else if(a==='delTx'){if(!armed(a+':'+v))return;const[m,id]=v.split('|');await delTx(m,id)}
  else if(a==='sbIn'){
    OFF=false;try{
      SB={url:val('su').replace(/\/+$/,''),key:val('sk'),email:val('se')};
      await sbAuth({email:val('se'),password:val('sp')},'password');
      const r=await sbReq('kv?k=eq.cfg&select=k');
      if(!(await r.json()).length){for(const k of Object.keys(localStorage)){if(k.startsWith('mt:')&&k!=='mt:sb'&&k!=='mt:dirty'){try{await put(k.slice(3),JSON.parse(localStorage.getItem(k)))}catch(e){}}}}
      await loadAll();S.msg='Connected. Cloud sync is on.';
    }catch(e){SB=null;try{localStorage.removeItem('mt:sb')}catch(x){}S.msg='Could not connect. Check the URL, key, email and password.'}}
  else if(a==='sbOut'){SB=null;try{localStorage.removeItem('mt:sb')}catch(e){}S.msg='Signed out. Data on this device is kept.'}
  else if(a==='sbSync'){OFF=false;try{await loadAll();S.msg='Synced'}catch(e){S.msg='Sync failed'}}
  else if(a==='copyBk'){
    const ms=c.mlist.slice();if(!ms.includes(S.month))ms.push(S.month);await Promise.all(ms.map(ensure));
    const txt=JSON.stringify({cfg:c,months:Object.fromEntries(ms.map(m=>[m,S.months[m]]))});
    try{await navigator.clipboard.writeText(txt);S.msg='Backup copied. Paste it into Notes to keep it safe.'}catch(e){S.bk=txt;S.rs=true;S.open='data';S.msg='Select and copy the text in the Backup box.'}}
  else if(a==='restoreBk'){
    try{const d=JSON.parse(val('bk'));if(!d.cfg||!d.months)throw 0;S.cfg=mig(Object.assign(defCfg(),d.cfg,{v:d.cfg.v}));S.months={};
      for(const m in d.months){S.months[m]=d.months[m];await sv('m_'+m,{tx:d.months[m]})}await saveCfg();S.bk='';S.rs=false;await ensure(S.month);S.msg='Backup restored'}
    catch(e){S.msg='That does not look like a valid backup'}}
  else if(a==='editTx'){S.editTx=v}
  else if(a==='saveTx2'){
    const[m,id]=v.split('|'),amt=cents(val('ea'));if(!amt){S.msg='Enter an amount';return render()}
    const o=(await ensure(m)).find(x=>x.id===id);if(!o)return render();
    const p={a:amt,d:val('ed')||o.d,note:val('en')};if(val('ec'))p.cat=val('ec');
    await updTx(m,id,p);S.editTx='';S.msg='Updated'+(o.t==='e'?budMsg(o.acc,p.cat||o.cat,S.month):'')}
  else if(a==='openAcc'){S.accId=v}
  else if(a==='back'){S.accId=''}
  else if(a==='quick'){
    const ac=A(S.accId),amt=cents(val('qa'));if(!ac||!amt){S.msg='Enter an amount';return render()}
    const t=ac.kind==='travel'?'e':val('qt');
    await addTx({id:uid(),t,a:amt,acc:ac.id,cat:ac.kind==='travel'?val('qc'):'',note:val('qn'),d:val('qd')||today()});S.msg='Saved'+(t==='e'?budMsg(ac.id,val('qc'),(val('qd')||today()).slice(0,7)):'')}
  else if(a==='addAcc'){
    const n=val('an'),cu=curOf('acu');if(!n||cu.length!==3){S.msg='Enter a name and a 3-letter currency code';return render()}
    const ob=val('ab');S.open='';c.accounts.push({id:uid(),name:n,cur:cu,kind:val('ak'),icon:val('ai'),bal:cents(ob)*(ob.startsWith('-')?-1:1)});await saveCfg()}
  else if(a==='delAcc'){if(!armed(a+':'+v))return;c.accounts=c.accounts.filter(x=>x.id!==v);await saveCfg()}
  else if(a==='saveRate'){c.rates[v]=cents(val('r'+v));await saveCfg();S.msg='Hourly rate saved for '+v}
  else if(a==='addBud'){
    const l=cents(val('bl')),ac=val('ba');if(!l||!A(ac)){S.msg='Enter a limit and pick an account';return render()}
    const ex=c.budgets.find(b=>b.month===S.month&&b.acc===ac&&b.cat===val('bc'));
    S.open='';if(ex)ex.limit=l;else c.budgets.push({id:uid(),month:S.month,acc:ac,cat:val('bc'),limit:l});await saveCfg()}
  else if(a==='copyBud'){const d=new Date(S.month+'-01T00:00:00');d.setMonth(d.getMonth()-1);const pm=d.getFullYear()+'-'+p2(d.getMonth()+1);c.budgets.filter(b=>b.month===pm).forEach(b=>{if(!c.budgets.some(x=>x.month===S.month&&x.acc===b.acc&&x.cat===b.cat))c.budgets.push({...b,id:uid(),month:S.month})});await saveCfg()}
  else if(a==='editBud'){S.editBud=v}
  else if(a==='saveBud'){const l=cents(val('eb')),b=c.budgets.find(x=>x.id===v);if(!b||!l){S.msg='Enter a valid amount';return render()}b.limit=l;S.editBud='';await saveCfg();S.msg='Budget updated'}
  else if(a==='delBud'){if(!armed(a+':'+v))return;c.budgets=c.budgets.filter(x=>x.id!==v);await saveCfg()}
  else if(a==='addCat'){const n=val('nc'+v),i=[...val('ni'+v)][0];if(n){const l=v==='e'?c.cats:c.icats;if(!l.includes(n))l.push(n);if(i)c.icons[n]=i;await saveCfg()}}
  else if(a==='delCat'){if(!armed(a+':'+v))return;const[k,n]=v.split('|');const l=k==='e'?c.cats:c.icats;l.splice(l.indexOf(n),1);await saveCfg()}
  else if(a==='addGoal'){
    const n=val('gn'),t=cents(val('gt'));if(!n||!t){S.msg='Enter a name and a target amount';return render()}
    S.open='';c.goals.push({id:uid(),name:n,cur:val('gu'),target:t,date:val('gd'),saved:cents(val('gi'))});await saveCfg()}
  else if(a==='saveGoal'){const g=c.goals.find(x=>x.id===v),m=cents(val('gs'+v));if(g&&m){g.saved+=m;await saveCfg()}}
  else if(a==='delGoal'){if(!armed(a+':'+v))return;c.goals=c.goals.filter(x=>x.id!==v);await saveCfg()}
  render();
}

(async()=>{
  $('#app').innerHTML='<div class="card mu">Loading…</div>';
  await Promise.race([initDb(),new Promise(r=>setTimeout(r,4000))]);ready=true;
  const raw=await ld('cfg');S.cfg=raw?mig(Object.assign(defCfg(),raw,{v:raw.v})):defCfg();
